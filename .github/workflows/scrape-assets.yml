name: Full Website Mirror

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download complete mirror
        run: |
          mkdir -p site_mirror
          cd site_mirror

          # Mirror the site and rewrite all internal links to local relative paths
          wget \
            --mirror \
            --page-requisites \
            --adjust-extension \
            --convert-links \
            --backup-converted \
            --no-host-directories \
            --execute robots=off \
            --wait=1 \
            --user-agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
            https://freeze.pharmasante.com.tr/ || true

          # Verification check
          ls -la

      - name: Upload full site as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: full-website-mirror
          path: site_mirror/
          retention-days: 14

      # Optional: Uncomment below if you want the files committed into your repository directly
      # - name: Commit mirrored files to repo
      #   run: |
      #     git config --global user.name "github-actions[bot]"
      #     git config --global user.email "github-actions[bot]@users.noreply.github.com"
      #     git add site_mirror/
      #     git diff --quiet && git diff --staged --quiet || (git commit -m "chore: full mirror of freeze.pharmasante.com.tr" && git push)
